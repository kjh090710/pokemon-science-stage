<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>캐치캐치: 포켓몬을 잡아라! — 공연 배경</title>
  <style>
    :root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#fff;background:#050a19}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}button,input{font:inherit}
    #stage{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:#071126;transition:background 1s}
    #stage:before{content:"";position:absolute;inset:-20%;z-index:-2;background:radial-gradient(circle at 65% 45%,var(--glow,#1c65a8) 0,transparent 35%),radial-gradient(circle at 15% 90%,var(--glow2,#064a5c) 0,transparent 40%);filter:blur(20px);animation:drift 15s ease-in-out infinite alternate}
    #stage:after{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(transparent,#000)}
    @keyframes drift{to{transform:translate(7%,-5%) rotate(7deg)}}
    .scene{position:absolute;inset:0;display:grid;place-items:center;padding:6vw;text-align:center;opacity:0;transform:scale(1.045);transition:opacity .65s,transform 1.2s;pointer-events:none}.scene.on{opacity:1;transform:scale(1);pointer-events:auto}
    .content{max-width:1500px;width:100%;position:relative}.eyebrow{color:#78eaff;letter-spacing:.24em;font-size:clamp(15px,1.8vw,30px);font-weight:800;margin-bottom:2.2vh}.title{font-size:clamp(46px,6.8vw,122px);font-weight:900;line-height:1.17;letter-spacing:-.065em;text-wrap:balance;text-shadow:0 8px 40px #0008}.sub{font-size:clamp(23px,3vw,52px);font-weight:700;line-height:1.45;margin-top:3.8vh;color:#e0efff;text-wrap:balance}.hint{font-size:clamp(19px,2.2vw,38px);margin-top:5vh;color:#a8c6e9}.accent{color:#ffe56e}.cyan{color:#67edff}.red{color:#ff6a73}.small{font-size:clamp(24px,3.6vw,64px)}
    .orbit{width:min(27vw,340px);aspect-ratio:1;border:6px solid #ffffff44;border-radius:50%;margin:5vh auto 0;box-shadow:0 0 30px #56eaff88,inset 0 0 40px #54baff88;position:relative;animation:turn 12s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;inset:17%;border:2px dashed #ffffff77}.orbit:after{inset:42%;background:#fff;box-shadow:0 0 45px 16px #64daff;animation:pulse 2s infinite alternate}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{to{box-shadow:0 0 85px 32px #64daff}}
    .letter{width:min(58vw,780px);height:min(38vh,400px);margin:3vh auto;background:#f2e9cf;color:#263348;border-radius:10px;box-shadow:0 30px 90px #0009;display:grid;place-items:center;transform:rotate(-3deg);font-size:clamp(30px,4vw,67px);font-weight:900;padding:30px}.secret{animation:reveal 2.5s both;background:linear-gradient(130deg,#f2e9cf,#f8f2dc)}@keyframes reveal{from{color:transparent;text-shadow:0 0 35px #a1590f}to{color:#593615;text-shadow:0 0 0 transparent}}
    .sequence{display:flex;justify-content:center;align-items:center;gap:2vw;margin-top:7vh;flex-wrap:wrap}.dot{width:min(10vw,160px);aspect-ratio:1;border-radius:28%;display:grid;place-items:center;font-size:clamp(28px,4vw,68px);font-weight:900;box-shadow:inset 0 8px 25px #ffffff55,0 18px 40px #0008}.green{background:#38d873}.yellow{background:#f9ca45;color:#2d2411}.blue{background:#244bda}.scarlet{background:#ff3c4e}.unknown{border:4px dashed #fff8}.arrow{font-size:clamp(28px,4vw,65px);color:#ffffff99}
    .beaker{width:min(26vw,360px);height:min(33vh,350px);margin:5vh auto 0;border:8px solid #c4e9ff;border-top:0;border-radius:0 0 55px 55px;position:relative;overflow:hidden;box-shadow:0 0 35px #82e4ff66}.liquid{position:absolute;inset:15% 0 0;background:var(--liquid);box-shadow:0 0 60px var(--liquid);animation:liquid 2.5s ease-in-out infinite alternate}.liquid:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#fff8,transparent 10%),radial-gradient(circle at 75% 65%,#fff8,transparent 8%)}@keyframes liquid{to{transform:skewY(5deg) translateY(2%)}}
    .door{height:43vh;width:min(28vw,400px);border:12px solid #76d5ff;border-bottom:0;border-radius:180px 180px 0 0;margin:3vh auto 0;background:linear-gradient(90deg,#091333 0 48%,#d3f4ff 49% 51%,#091333 52%);box-shadow:0 0 70px #63e5ffbb;transform-origin:center;animation:open 2s ease-out both}@keyframes open{from{transform:scaleX(.2);filter:brightness(3)}to{transform:scaleX(1)}}
    .luminol{width:min(42vw,600px);height:min(30vh,320px);margin:6vh auto 0;position:relative;filter:drop-shadow(0 0 20px #59b9ff)}.luminol span{position:absolute;width:9px;height:9px;border-radius:50%;background:#aeeeff;box-shadow:0 0 15px 5px #36a8ff;animation:twinkle 1.8s ease-in-out infinite alternate}.luminol span:nth-child(3n){animation-delay:.5s}.luminol span:nth-child(4n){animation-delay:1s}@keyframes twinkle{to{opacity:.2;transform:scale(.4)}}
    .plasma{width:min(32vw,400px);aspect-ratio:1;margin:3vh auto;border-radius:50%;border:5px solid #a7d1ff88;background:radial-gradient(circle,#ebfaff 0 4%,#7d5cf4 6%,#1d1770 18%,#111232 65%);box-shadow:0 0 100px #7b55ffbb,inset 0 0 45px #7c80ff}.plasma:before{content:"";display:block;position:relative;top:10%;left:10%;width:80%;height:80%;border-radius:50%;background:repeating-conic-gradient(from 20deg,#ffffff00 0deg 23deg,#a68bff 25deg 27deg,#ffffff00 30deg 55deg);filter:blur(3px);animation:turn 5s linear infinite}
    .blackout{background:#000!important}.blackout:before,.blackout:after{display:none}.blackout .eyebrow{color:#7f9ab0}.blackout .title{font-size:clamp(42px,5vw,85px);color:#ecf3fa}.blackout .sub{color:#94a5b8;font-size:clamp(22px,2.7vw,42px)}
    .quiz-number{color:#ffe56e;font-size:clamp(24px,3vw,48px);font-weight:900;letter-spacing:.15em}.answer{color:#6effd4;animation:answer .6s both}@keyframes answer{from{opacity:0;transform:translateY(35px) scale(.8)}to{opacity:1;transform:none}}
    #chrome{position:absolute;z-index:20;bottom:0;left:0;right:0;padding:10px 18px 15px;display:flex;align-items:center;gap:8px;background:linear-gradient(transparent,#030817d9);opacity:.15;transition:opacity .2s}#chrome:hover,#chrome:focus-within{opacity:1}#chrome button,#chrome label{border:1px solid #ffffff44;background:#0b1838dc;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;font-size:14px}#chrome button:hover,#chrome label:hover{background:#24518d}#chrome input{display:none}#count{margin-left:auto;color:#c8d9ee;font-size:14px}#musicStatus{font-size:12px;color:#a9d0e7;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #notes{display:none;position:absolute;z-index:30;top:20px;right:20px;width:min(440px,40vw);max-height:65vh;overflow:auto;background:#071326f2;color:#edf6ff;padding:20px;border:1px solid #ffffff55;border-radius:12px;box-shadow:0 18px 50px #000a;font-size:16px;line-height:1.55}#notes.on{display:block}#notes strong{display:block;color:#79e6ff;margin-bottom:8px}#notes p{margin:0}#notes small{display:block;margin-top:12px;color:#a9bcd0}
    @media(max-width:700px){.title{font-size:clamp(38px,9vw,72px)}.sub{font-size:clamp(20px,4.4vw,35px)}.eyebrow{font-size:14px}.dot{width:14vw}.orbit,.plasma{width:50vw}.beaker{width:45vw}#chrome{opacity:1;flex-wrap:wrap}#chrome button,#chrome label{font-size:12px;padding:7px}#notes{width:calc(100vw - 30px);right:15px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    /* 무대 화면: 장면 사진이 주인공이며, 문이 열릴 때만 움직인다. */
    #stage{background:#000!important;cursor:pointer}
    #stage:before{inset:0;z-index:0;filter:none;animation:none;background-image:var(--scene-image);background-size:cover;background-position:center}
    #stage.lake-scene:before{filter:brightness(.82) saturate(.84);transition:filter 1.15s ease-in-out}
    #stage.lake-scene.lake-dark:before{filter:brightness(.49) saturate(.66) contrast(1.05)}
    #stage:after{display:none}
    #stage.blackout:before{display:none}
    .scene{z-index:2;transition:none;transform:none!important;pointer-events:none;padding:2vw}
    .scene .eyebrow,.scene .sub,.scene .orbit,.scene .letter,.scene .sequence,.scene .beaker,.scene .luminol,.scene .plasma,.scene .door{display:none}
    .scene .title{font-size:clamp(38px,5vw,92px);text-shadow:0 4px 16px #002444,0 10px 35px #000;line-height:1.2}
    .scene .title:empty{display:none}
    .blackout .scene{display:none}
    #gate-canvas{display:none;position:absolute;z-index:1;left:50%;top:50%;width:max(100vw,177.777vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%);pointer-events:none}
    #stage.gate-scene #gate-canvas{display:block}
    #portal{position:absolute;overflow:hidden;clip-path:polygon(0 32%,5% 25%,13% 18%,22% 11%,35% 4%,50% 0,65% 4%,78% 11%,87% 18%,95% 25%,100% 32%,100% 100%,0 100%);background:transparent}
    #stage.door-cleared #gate-canvas{display:none}
    .gate-half{position:absolute;top:0;bottom:0;width:50%;background-image:url('backgrounds/03-gate-closed.png');background-repeat:no-repeat;transition:transform 2.3s cubic-bezier(.65,0,.25,1)}
    .gate-left{left:0}.gate-right{right:0}
    #stage.gate-open .gate-left{transform:translateX(-101%)}#stage.gate-open .gate-right{transform:translateX(101%)}
    #lake-darkening{display:none;position:absolute;inset:0;z-index:1;pointer-events:none;background:#07090c;opacity:0;transition:opacity 1.15s ease-in-out;-webkit-mask-image:url('backgrounds/07-lake-ground-water-mask.png');mask-image:url('backgrounds/07-lake-ground-water-mask.png');-webkit-mask-size:cover;mask-size:cover;-webkit-mask-position:center;mask-position:center}
    #stage.lake-scene #lake-darkening{display:block}
    #stage.lake-dark #lake-darkening{opacity:.88}
    #stage.blackout #lake-darkening{display:none}
    .answer{animation:none}
    #chrome{background:#061126a8;opacity:0}
    #chrome:hover,#chrome:focus-within{opacity:1}
    body.performance #chrome{display:none!important}
    @media(max-width:700px){#chrome{opacity:0}#chrome:hover,#chrome:focus-within{opacity:1}}
  </style>
</head>
<body>
  <main id="stage" aria-live="polite"><div id="gate-canvas"><div id="portal"><div class="gate-half gate-left"></div><div class="gate-half gate-right"></div></div></div><div id="lake-darkening" aria-hidden="true"></div><section class="scene on"><div class="content"></div></section></main>
  <aside id="notes" aria-label="운영 메모"></aside>
  <nav id="chrome" aria-label="공연 조작">
    <button id="prev" title="이전: 왼쪽 화살표">◀ 이전</button><button id="next" title="다음: 오른쪽 화살표 또는 스페이스">다음 ▶</button>
    <button id="black" title="긴급 암전: B">● 암전</button><button id="full" title="전체 화면: F">전체 화면</button><button id="noteBtn" title="운영 메모: O">메모</button>
    <label for="audioFile">노래 파일 연결</label><input id="audioFile" type="file" accept="audio/*" />
    <button id="freeMusic" title="무료 원곡 재생용 조작 페이지">무료 원곡 열기</button>
    <button id="music" title="노래 재생/일시정지: M">♪ 재생</button><span id="musicStatus">음원 미연결</span><span id="count"></span>
  </nav>
  <audio id="song" loop preload="auto" src="audio/우리는 모두 친구.mp3"></audio>
  <script>
    const cues=[
      {chapter:'1장 · 박사님 연구실',bg:'00-lab',note:'사전 준비: 칠판에 UV 종이 부착, 손전등은 로사 주머니, 지우는 몬스터볼. 박사님이 지우와 웅이를 소개하고 두 사람이 모험을 떠날 때까지 유지.'},
      {chapter:'1장 · 로켓단 등장',bg:'01-town',note:'지우와 웅이가 퇴장하고 로켓단이 등장할 때 클릭. 로켓단 구호가 끝나고 정전될 때까지 유지.'},
      {chapter:'1장 · UV 단서와 전환 암전',blackout:true,music:'stop',note:'갑자기 불이 꺼질 때 클릭. 로사가 손전등으로 실제 칠판의 “호수” 단서를 비춤. 로켓단 퇴장 뒤 S 키로 「우리는 모두 친구」를 시작. 2장 세팅 완료 후 클릭 한 번으로 다음 배경.'},
      {chapter:'2장 · 적양배추 만능 지시약',bg:'03-gate',music:'fade',note:'보라색 용액 비커 4개, 식초, 베이킹소다 용액, 안내문. 가짜 메타몽을 찾는 실험 동안 닫힌 문 유지.'},
      {chapter:'2장 · 문 열림',bg:'03-gate',visual:'door',note:'지우가 “메타몽! 넌 내꺼야!”라고 한 뒤 문 열림 효과음에 맞춰 클릭. 문짝만 열림.'},
      {chapter:'2장 후 암전',blackout:true,music:'play',note:'3장 루미놀·플루오레세인 실험 세팅. 검은 화면에서 노래 소리만 재생.'},
      {chapter:'3장 · 바다',bg:'06-sea',music:'fade',note:'루미놀과 플루오레세인 반응, 꼬부기 등장. 이 장에서는 문이 열리지 않음.'},
      {chapter:'3장 후 암전',blackout:true,music:'play',note:'4장 녹말 용액 호수, 아이오딘, 비타민 C, 플라즈마볼 세팅.'},
      {chapter:'4장 · 맑은 호수',bg:'07-lake',music:'fade',note:'4장 시작. 로켓단이 아이오딘을 붓기 전까지 맑은 호수를 유지.'},
      {chapter:'4장 · 검게 변한 호수',bg:'07-lake',lake:'dark',note:'로켓단이 녹말 호수에 아이오딘을 부어 물이 검게 변하는 순간 클릭. 물과 주변 풍경이 함께 어두워짐. 피카츄의 플라즈마볼 장면까지 유지.'},
      {chapter:'4장 · 다시 맑아진 호수',bg:'07-lake',note:'웅이가 비타민 C 용액을 부어 호수가 맑아지는 순간 클릭. 물이 파랗게 돌아오고 주변 풍경도 다시 밝아짐. 전설의 포켓몬 등장까지 유지.'},
      {chapter:'5장 · 박사님 연구실로 귀환',bg:'00-lab',note:'지우와 친구들이 박사님 연구실로 돌아와 도감 완성과 마무리. 배우 대사만 진행하고 화면에는 배경만 표시.'},
      {chapter:'5장 후 암전 · 커튼콜',blackout:true,music:'stop',note:'마무리 후 암전. 로켓단 인사와 커튼콜. 퀴즈쇼를 진행하면 다음 큐로 이동.'},
      {chapter:'박사님의 포켓몬 퀴즈쇼',bg:'00-lab',note:'대본 5장 이후의 선택 퀴즈. 박사님 연구실을 유지하며 화면에는 문제·정답을 표시하지 않음.'}
    ];
    const stage=document.querySelector('#stage'),scene=stage.querySelector('.scene'),notes=document.querySelector('#notes'),audio=document.querySelector('#song');let index=0,emergency=false,audioURL=null,fadeTimer=null,doorTimer=null;
    function visual(c){if(c.visual==='orbit')return '<div class="orbit"></div>';if(c.visual==='letter')return '<div class="letter">?</div>';if(c.visual==='secret')return '<div class="letter secret">전설의 포켓몬<br>비밀 편지</div>';if(c.visual==='sequence')return '<div class="sequence"><span class="dot green"></span><span class="arrow">→</span><span class="dot yellow"></span><span class="arrow">→</span><span class="dot unknown">?</span><span class="arrow">→</span><span class="dot yellow"></span><span class="arrow">→</span><span class="dot unknown">?</span></div>';if(c.visual==='beaker')return `<div class="beaker"><div class="liquid" style="--liquid:${c.liquid}"></div></div>`;if(c.visual==='door')return '<div class="door"></div>';if(c.visual==='plasma')return '<div class="plasma"></div>';if(c.visual==='luminol')return '<div class="luminol">'+Array.from({length:48},(_,i)=>`<span style="left:${(i*47)%100}%;top:${(i*73)%100}%"></span>`).join('')+'</div>';return ''}
    function setVolume(to,ms=500){clearInterval(fadeTimer);const start=audio.volume,steps=20;let n=0;fadeTimer=setInterval(()=>{n++;audio.volume=Math.max(0,Math.min(1,start+(to-start)*n/steps));if(n>=steps)clearInterval(fadeTimer)},ms/steps)}
    function music(c){if(!audio.src||audio.error)return;if(c.music==='stop'){audio.pause();audio.currentTime=0;audio.volume=0}else if(c.music==='play'){audio.volume=.72;audio.currentTime=0;audio.play().catch(()=>{document.querySelector('#musicStatus').textContent='재생 차단됨 · 노래 버튼을 누르세요'})}else if(c.music==='low'){setVolume(.12);audio.play().catch(()=>{})}else if(c.music==='fade')setVolume(0,1100);updateMusic()}
    function backdropName(c){return c.bg||'01-town'}
    function setBackdrop(name){const files={'00-lab':'00-lab-sharp.png','01-town':'01-town-ground.png','03-gate':'03-gate-open.png','06-sea':'06-sea-ground.png','07-lake':'07-lake-ground.png'};stage.style.setProperty('--scene-image',`url("backgrounds/${files[name]||name+'.jpg'}")`)}
    function sizeDoor(){const canvas=document.querySelector('#gate-canvas'),portal=document.querySelector('#portal'),w=canvas.clientWidth,h=canvas.clientHeight,left=w*514/1672,top=h*341/941,width=w*566/1672,height=h*250/941;portal.style.left=`${left}px`;portal.style.top=`${top}px`;portal.style.width=`${width}px`;portal.style.height=`${height}px`;for(const [half,offset] of [[portal.querySelector('.gate-left'),0],[portal.querySelector('.gate-right'),width/2]]){half.style.backgroundSize=`${w}px ${h}px`;half.style.backgroundPosition=`${-(left+offset)}px ${-top}px`}}
    function render(){const c=cues[index];clearTimeout(doorTimer);stage.classList.toggle('blackout',!!c.blackout||emergency);stage.classList.toggle('gate-scene',c.bg==='03-gate');stage.classList.toggle('lake-scene',c.bg==='07-lake');stage.classList.toggle('lake-dark',c.lake==='dark');stage.classList.remove('gate-open','door-cleared');setBackdrop(backdropName(c));if(c.bg==='03-gate')sizeDoor();scene.innerHTML='';scene.classList.add('on');if(c.visual==='door')requestAnimationFrame(()=>requestAnimationFrame(()=>{if(cues[index]!==c)return;stage.classList.add('gate-open');doorTimer=setTimeout(()=>{if(cues[index]===c)stage.classList.add('door-cleared')},2400)}));notes.innerHTML=`<strong>${c.chapter} · 운영 메모</strong><p>${c.note||''}</p><small>화면 클릭 / → / Space: 다음 · ←: 이전 · B: 암전 · F: 전체 화면 · O: 메모 · M: 음악</small>`;document.querySelector('#count').textContent=`${index+1} / ${cues.length}`;music(c)}
    function updateMusic(){document.querySelector('#music').textContent=audio.paused||audio.volume<.05?'♪ 노래 시작':'Ⅱ 일시정지';document.querySelector('#musicStatus').textContent=audio.error?'음원 파일 없음 · 파일 연결 필요':audio.readyState>=2?`음원 준비됨 · 볼륨 ${Math.round(audio.volume*100)}%`:'음원 확인 중'}
    function startSong(){if(audio.error||!audio.src){document.querySelector('#audioFile').click();return}setVolume(.72);audio.play().catch(()=>{document.querySelector('#musicStatus').textContent='재생 실패 · 음원 파일을 확인하세요'});updateMusic()}
    function go(delta){index=Math.max(0,Math.min(cues.length-1,index+delta));emergency=false;render()}
    document.querySelector('#prev').onclick=()=>go(-1);document.querySelector('#next').onclick=()=>go(1);document.querySelector('#black').onclick=()=>{emergency=!emergency;stage.classList.toggle('blackout',emergency||!!cues[index].blackout)};document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};document.querySelector('#noteBtn').onclick=()=>notes.classList.toggle('on');document.querySelector('#freeMusic').onclick=()=>window.open('music-control.html','pokemon-music-control','width=900,height=750');document.querySelector('#music').onclick=()=>{if(!audio.src||audio.paused||audio.volume<.05)startSong();else{audio.pause();updateMusic()}};
    document.querySelector('#audioFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);audio.src=audioURL;audio.load();audio.volume=.72;updateMusic()};
    audio.addEventListener('canplay',updateMusic);audio.addEventListener('error',updateMusic);
    stage.addEventListener('click',()=>go(1));
    document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft')go(-1);else if(e.key.toLowerCase()==='b')document.querySelector('#black').click();else if(e.key.toLowerCase()==='f')document.querySelector('#full').click();else if(e.key.toLowerCase()==='o')document.querySelector('#noteBtn').click();else if(e.key.toLowerCase()==='m')document.querySelector('#music').click();else if(e.key.toLowerCase()==='s')startSong();else if(e.key.toLowerCase()==='c')document.body.classList.toggle('performance');else if(e.key.toLowerCase()==='u')document.querySelector('#freeMusic').click()});
    document.body.classList.add('performance');
    ['00-lab-sharp.png','01-town-ground.png','03-gate-open.png','03-gate-closed.png','06-sea-ground.png','07-lake-ground.png','07-lake-ground-water-mask.png'].forEach(name=>{const preload=new Image();preload.src=`backgrounds/${name}`});
    window.addEventListener('resize',()=>{if(cues[index].bg==='03-gate')sizeDoor()});
    render();
  </script>
</body>
</html>
